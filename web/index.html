<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Qwen3-TTS</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="device" id="device">
  <i class="screw tl"></i><i class="screw tr"></i>

  <!-- Nameplate -->
  <header class="topbar">
    <div class="brand">
      <img class="badge" src="icon.svg" alt="">
      <div>
        <div class="wordmark" data-i18n="brand"></div>
        <div class="model" id="model-line"></div>
      </div>
    </div>
    <div class="leds">
      <span class="led" id="led-preset" data-i18n-title="led.presetTip"><i></i><span data-i18n="led.preset"></span></span>
      <span class="led" id="led-clone" data-i18n-title="led.cloneTip"><i></i><span data-i18n="led.clone"></span></span>
      <span class="led rec" id="led-rec"><i></i><span data-i18n="led.rec"></span></span>
    </div>
    <div class="topkeys">
      <a class="home-link" id="home-link" hidden></a>
      <div class="ui-lang" role="group" aria-label="Language">
        <button data-ui-lang="zh">中文</button><button data-ui-lang="en">EN</button>
      </div>
      <button class="key sm" id="btn-scripts" data-i18n="btn.scripts"></button>
      <button class="key sm accent" id="btn-new" data-i18n="btn.new"></button>
    </div>
  </header>

  <div class="workspace">
    <!-- Left column: voice library -->
    <aside class="side">
      <section class="library">
        <div class="lib-head">
          <div class="strip-label"><span data-i18n="lib.title"></span></div>
          <div class="lib-tabs" role="tablist">
            <button role="tab" data-tab="system"><span data-i18n="lib.system"></span><b id="count-system"></b></button>
            <button role="tab" data-tab="custom"><span data-i18n="lib.custom"></span><b id="count-custom"></b></button>
          </div>
        </div>
        <div class="lib-filters">
          <div class="filter" id="f-lang">
            <span class="filter-label" data-i18n="f.lang"></span>
            <button data-v="" data-i18n="f.all"></button><button data-v="zh" data-i18n="vl.zh"></button><button data-v="en" data-i18n="vl.en"></button><button data-v="ja" data-i18n="vl.ja"></button><button data-v="ko" data-i18n="vl.ko"></button><button data-v="dialect" data-i18n="vl.dialect"></button>
          </div>
          <div class="filter" id="f-gender">
            <span class="filter-label" data-i18n="f.gender"></span>
            <button data-v="" data-i18n="f.all"></button><button data-v="f" data-i18n="g.f"></button><button data-v="m" data-i18n="g.m"></button>
          </div>
          <label class="search"><svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.4 4.4-1.4 1.4-4.4-4.4A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg><input type="search" id="f-search" data-i18n-ph="f.search"></label>
        </div>
        <div class="shelf" id="shelf"></div>
      </section>
      <div class="hints">
        <span><kbd>G</kbd><span data-i18n="h.g"></span></span><span><kbd>A</kbd><span data-i18n="h.a"></span></span><span><kbd>␣</kbd><span data-i18n="h.space"></span></span><span><kbd>↑↓</kbd><span data-i18n="h.arrows"></span></span><span><kbd>1-9</kbd><span data-i18n="h.num"></span></span><span><kbd>⌘↵</kbd><span data-i18n="h.cmdEnter"></span></span>
      </div>
    </aside>

    <!-- Right column: knobs + paragraphs -->
    <section class="main">
      <section class="controls">
        <div class="panel gen">
          <div class="panel-label"><span data-i18n="gen.title"></span><em data-i18n="gen.note"></em></div>
          <div class="gen-body">
            <div class="knobs" id="knobs-gen"></div>
            <div class="gen-right">
              <div class="field-label" data-i18n="gen.lang"></div>
              <div class="slide-switch" id="lang" role="radiogroup">
                <i class="thumb"></i>
                <button data-v="auto" data-i18n="gl.auto"></button><button data-v="chinese" data-i18n="gl.chinese"></button><button data-v="english" data-i18n="gl.english"></button><button data-v="japanese" data-i18n="gl.japanese"></button><button data-v="korean" data-i18n="gl.korean"></button>
              </div>
              <div class="field-label"><span data-i18n="mood.label"></span><em id="mood-note"></em></div>
              <label class="dymo" id="dymo"><input id="mood" maxlength="200" autocomplete="off" spellcheck="false" data-i18n-ph="mood.ph"></label>
              <div class="chips" id="mood-chips"></div>
            </div>
          </div>
        </div>
        <div class="panel post">
          <div class="panel-label"><span data-i18n="post.title"></span><em data-i18n="post.note"></em></div>
          <div class="knobs" id="knobs-post"></div>
        </div>
      </section>

      <section class="tape">
        <div class="tape-head">
          <div class="strip-label"><span data-i18n="trk.title"></span><em data-i18n="trk.hint"></em></div>
          <div class="tape-actions">
            <button class="key sm" id="btn-rec-all" data-i18n="btn.recAll" data-i18n-title="btn.recAllTip"></button>
            <button class="key sm" id="btn-add" data-i18n="btn.add"></button>
          </div>
        </div>
        <div id="tracks" class="tracks"></div>
        <div class="empty" id="empty" hidden>
          <div class="cart blank" aria-hidden="true">
            <div class="sticker"><div class="nm"><span data-i18n="empty.label"></span></div><div class="ds">— — — — — —</div></div>
            <div class="window"><i class="reel"></i><i class="reel"></i></div>
          </div>
          <p data-i18n="empty.text"></p>
          <button class="key accent" id="btn-new2" data-i18n="btn.new"></button>
        </div>
      </section>
    </section>
  </div>

  <!-- Floating player: VU meter + LCD + transport keys -->
  <footer class="dock" id="dock">
    <div class="grille" id="grille" aria-hidden="true"></div>
    <div class="lcd" id="lcd">
      <div class="lcd-top">
        <span id="lcd-title" class="lcd-title" contenteditable="true" spellcheck="false" data-i18n-title="lcd.renameTip"></span>
        <span id="lcd-mode" class="lcd-mode"></span>
      </div>
      <div class="lcd-main">
        <div class="lcd-counter" id="lcd-counter"><span class="ghost">88:88.8</span><span class="val">00:00.0</span></div>
        <div class="lcd-side">
          <div><small data-i18n="lcd.track"></small><b id="lcd-trk">--</b></div>
          <div><small data-i18n="lcd.done"></small><b id="lcd-done">0/0</b></div>
          <div><small data-i18n="lcd.voice"></small><b id="lcd-voice">—</b></div>
        </div>
      </div>
      <div class="lcd-msg" id="lcd-msg"></div>
      <div class="lcd-meter"><i id="lcd-progress"></i></div>
    </div>
    <div class="tkeys">
      <button class="tkey rec" id="t-rec" data-i18n-title="t.recTip"><svg viewBox="0 0 24 24"><path d="M12 3.5 13.9 9l5.6 1.1-4.3 3.7 1.1 5.7L12 16.7l-4.3 2.8 1.1-5.7-4.3-3.7L10.1 9z"/></svg><span data-i18n="t.rec"></span></button>
      <button class="tkey" id="t-play" data-i18n-title="t.playTip"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg><span data-i18n="t.play"></span></button>
      <button class="tkey" id="t-all" data-i18n-title="t.allTip"><svg viewBox="0 0 24 24"><path d="M3.5 5.5v13l8-6.5zM12 5.5v13l8-6.5z"/></svg><span data-i18n="t.all"></span></button>
      <button class="tkey" id="t-stop" data-i18n-title="t.stopTip"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg><span data-i18n="t.stop"></span></button>
      <button class="tkey bounce" id="t-bounce" data-i18n-title="t.exportTip"><svg viewBox="0 0 24 24"><path d="M12 4v10m0 0-4-4m4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="t.export"></span></button>
    </div>
  </footer>
</main>

<!-- New script -->
<dialog id="dlg-new" class="sheet">
  <form method="dialog">
    <h3 data-i18n="new.title"></h3>
    <p class="sub" data-i18n="new.sub"></p>
    <input id="new-title" maxlength="60" data-i18n-ph="new.titlePh">
    <textarea id="new-text" rows="12" data-i18n-ph="new.textPh"></textarea>
    <div class="sheet-foot">
      <span class="sub" id="new-count"></span>
      <button value="cancel" class="key sm" data-i18n="d.cancel"></button>
      <button value="ok" id="new-ok" class="key sm accent" data-i18n="new.create"></button>
    </div>
  </form>
</dialog>

<!-- Script list -->
<dialog id="dlg-scripts" class="sheet">
  <form method="dialog">
    <h3 data-i18n="scripts.title"></h3>
    <div id="script-list" class="script-list"></div>
    <div class="sheet-foot"><button value="cancel" class="key sm" data-i18n="d.close"></button></div>
  </form>
</dialog>

<!-- New / edit voice -->
<dialog id="dlg-voice" class="sheet">
  <form method="dialog">
    <h3 id="voice-title"></h3>
    <p class="sub" id="voice-sub"></p>
    <label class="drop" id="voice-drop">
      <input type="file" id="voice-file" accept="audio/*,video/*,.m4a,.wav,.mp3,.aac,.flac,.mov,.mp4" hidden>
      <span id="voice-drop-text"></span>
    </label>
    <audio id="voice-audio" controls hidden></audio>
    <div class="row2">
      <input id="voice-name" maxlength="24" data-i18n-ph="v.namePh">
      <select id="voice-gender"><option value="" data-i18n="v.unset"></option><option value="f" data-i18n="g.f"></option><option value="m" data-i18n="g.m"></option></select>
      <select id="voice-lang"><option value="zh" data-i18n="vl.zh"></option><option value="en" data-i18n="vl.en"></option><option value="ja" data-i18n="vl.ja"></option><option value="ko" data-i18n="vl.ko"></option><option value="other" data-i18n="vl.other"></option></select>
    </div>
    <div class="row2 between">
      <span class="field-label" data-i18n="v.refText"></span>
      <button type="button" id="voice-asr" class="key sm" data-i18n="v.asr"></button>
    </div>
    <textarea id="voice-text" rows="4" data-i18n-ph="v.textPh"></textarea>
    <div class="sheet-foot">
      <button type="button" id="voice-del" class="key sm danger" data-i18n="v.delete" hidden></button>
      <span class="sub" id="voice-status"></span>
      <button value="cancel" class="key sm" data-i18n="d.cancel"></button>
      <button value="ok" id="voice-ok" class="key sm accent"></button>
    </div>
  </form>
</dialog>

<!-- Export -->
<dialog id="dlg-export" class="sheet">
  <form method="dialog">
    <h3 data-i18n="x.title"></h3>
    <p class="sub" id="export-sum"></p>
    <div class="formats" id="export-fmt">
      <label><input type="radio" name="fmt" value="wav" checked><b>WAV</b><span data-i18n="x.wav"></span></label>
      <label><input type="radio" name="fmt" value="mp3"><b>MP3</b><span data-i18n="x.mp3"></span></label>
      <label><input type="radio" name="fmt" value="zip"><b>ZIP</b><span data-i18n="x.zip"></span></label>
    </div>
    <div class="sheet-foot">
      <span class="sub" id="export-status"></span>
      <button value="cancel" class="key sm" data-i18n="d.close"></button>
      <button value="ok" id="export-ok" class="key sm accent" data-i18n="x.go"></button>
    </div>
  </form>
</dialog>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
